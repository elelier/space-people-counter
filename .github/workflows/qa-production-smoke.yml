name: Production browser smoke (issue 39)

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/qa/post-release-smoke.mjs"
      - ".github/workflows/qa-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postrelease-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install isolated browser QA tools (do not modify lockfile)
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production HTTP and browser smoke
        env:
          SPACE_PEOPLE_BASE_URL: https://spacepeople.elelier.com
        run: node scripts/qa/post-release-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-39-production-browser-evidence
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
