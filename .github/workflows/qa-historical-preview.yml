name: QA Historical Milestones Preview (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qa-historical-preview.yml"
      - "scripts/qa/qa-milestones-preview.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install isolated Playwright
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser QA on immutable Preview from functional commit
        env:
          PREVIEW_URL: https://13adf3f7.space-people-counter.pages.dev
        run: node scripts/qa/qa-milestones-preview.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-22-23-history-preview-evidence
          path: qa-artifacts/history/
          if-no-files-found: warn
          retention-days: 7
